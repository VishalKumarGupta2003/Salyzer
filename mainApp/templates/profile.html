<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Profile</h1>
            <div class="flex items-center space-x-4">
                <span>Welcome, {{ user.username }}</span>
                <a href="{% url 'dashboard' %}" class="bg-blue-500 hover:bg-blue-700 px-4 py-2 rounded">Dashboard</a>
                <a href="{% url 'logout' %}" class="bg-red-500 hover:bg-red-700 px-4 py-2 rounded">Logout</a>
            </div>
        </div>
    </nav>
    
    <div class="container mx-auto mt-8 p-4">
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-4">User Profile</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username:</label>
                    <p class="mt-1">{{ user.username }}</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email:</label>
                    <p class="mt-1">{{ user.email }}</p>
                </div>
                {% if profile %}
                <div>
                    <label class="block text-sm font-medium text-gray-700">Bio:</label>
                    <p class="mt-1">{{ profile.bio|default:"No bio provided" }}</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Phone:</label>
                    <p class="mt-1">{{ profile.phone_number|default:"No phone provided" }}</p>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
