<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Activity</h1>
            <div class="flex items-center space-x-4">
                <a href="{% url 'dashboard' %}" class="bg-blue-500 hover:bg-blue-700 px-4 py-2 rounded">Dashboard</a>
                <a href="{% url 'logout' %}" class="bg-red-500 hover:bg-red-700 px-4 py-2 rounded">Logout</a>
            </div>
        </div>
    </nav>
    
    <div class="container mx-auto mt-8 p-4">
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-xl font-semibold mb-4">Activity Overview</h2>
            {% if activities %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="p-4 bg-blue-50 rounded">
                    <h3 class="font-semibold">Logins Today</h3>
                    <p class="text-2xl">{{ activities.logins_today }}</p>
                </div>
                <div class="p-4 bg-green-50 rounded">
                    <h3 class="font-semibold">Logins This Week</h3>
                    <p class="text-2xl">{{ activities.logins_week }}</p>
                </div>
            </div>
            {% else %}
                <p class="text-gray-500">No activity data available.</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
